[project]
name = "llm-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "B777B2056-2", email = "md82b2127@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "transformers[torch]>=5.18.0",
    "torch",
    "torchvision",
    "matplotlib>=3.11.2",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[tool.uv]
index-strategy = "unsafe-best-match"
